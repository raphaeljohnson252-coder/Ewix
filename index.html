    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ewixstudio — Websites, Flyers &amp; AI Videos by Raphael</title>
    <meta
      name="description"
      content="Ewixstudio by Raphael: clear, mobile-friendly websites, flyers and short AI videos for diabetes and health businesses in Australia. Request a free homepage mockup."
    />
    <meta property="og:title" content="Ewixstudio — Websites, Flyers &amp; AI Videos by Raphael" />
    <meta
      property="og:description"
      content="Clear, mobile-friendly websites, flyers and short AI videos for diabetes and health businesses in Australia."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,400;1,600&family=DM+Sans:ital,opsz,wght@0,9..40,400..600;1,9..40,400&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('ewixstudio-theme');
          if (saved !== 'light') {
            document.documentElement.classList.add('dark');
          }
          var params = new URLSearchParams(window.location.search);
          var redirectPath = params.get('p');
          if (redirectPath) {
            var base = window.location.pathname.replace(/\/+$/, '');
            window.history.replaceState(null, '', base + redirectPath + window.location.hash);
          }
        } catch (e) {
          document.documentElement.classList.add('dark');
        }
      })();
    </script>
  </head>

    <script type="module" src="/src/main.tsx"></script>
